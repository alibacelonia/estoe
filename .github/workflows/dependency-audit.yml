name: Dependency audit
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv export --locked --all-groups --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/audit.txt" --quiet
      - run: uvx pip-audit==2.10.0 --requirement "$RUNNER_TEMP/audit.txt" --disable-pip --no-deps --strict
