name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
      - run: uvx --from ./dist/estoe-0.1.0-py3-none-any.whl estoe --help
      - run: uvx --from ./dist/estoe-0.1.0-py3-none-any.whl estoe pull --help
      - run: uvx --from ./dist/estoe-0.1.0-py3-none-any.whl estoe --version
