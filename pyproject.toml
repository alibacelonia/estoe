[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "estoe"
version = "0.2.0.dev0"
description = "Secret to Env — generate local dotenv files from cloud secrets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.37,<2",
    "azure-identity>=1.23,<2",
    "azure-keyvault-secrets>=4.9,<5",
    "google-cloud-secret-manager>=2.24,<3",
    "google-crc32c>=1.7,<2",
]

[project.urls]
Repository = "https://github.com/alibacelonia/estoe"
Issues = "https://github.com/alibacelonia/estoe/issues"

[project.scripts]
estoe = "estoe.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1", "python-dotenv>=1.1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/estoe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
