[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "estoe"
version = "0.1.0.dev0"
description = "Secret to Env — generate local dotenv files from cloud secrets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
estoe = "estoe.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/estoe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
